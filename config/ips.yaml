investor_profile:
  # Maximizar retornos ajustados por riesgo, aceptando cierta volatilidad
  type: dynamic
  risk_tolerance: high
  horizon: medium_term
  currency: EUR

objectives:
  target_return: 0.12
  sharpe_min: 1.0

risk_metrics:
  target_volatility: 0.12    # 12% vol anual objetivo
  max_volatility: 0.18       # 18% vol anual máxima aceptada
  max_drawdown: 0.20

restrictions:
  max_asset_weight: 0.20
  leverage: false

  # Efectivo: entre 5% y 10%
  min_cash: 0.05
  max_cash: 0.10

  # Cuotas por clase: 'budgeted' y también máximos
  cap_mode: budgeted
  max_asset_class_weight:
    equities: 0.60
    forex: 0.25
    crypto: 0.05        # 0.60 + 0.25 + 0.05 = 0.90  → factible con min/max cash

  max_position_value_eur: 50000

universes:
  equities: true
  forex: true
  crypto: true

rebalancing:
  frequency: monthly
